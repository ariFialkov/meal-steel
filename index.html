<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#4db6f5" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="Meal Steel: suped-up food trucks race, rumble, play soccer and musical trucks. Bet, drive, win the pot." />
  <link rel="icon" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <title>Meal Steel</title>
  <script type="module" crossorigin src="./assets/index.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index.css">
<link rel="manifest" href="./manifest.json"><script id="vite-plugin-pwa:register-sw" src="./registerSW.js"></script></head>
<body>
  <div id="app">
    <canvas id="gl"></canvas>
    <div id="fade"></div>

    <!-- MAIN MENU -->
    <section id="menu" class="screen">
      <header class="menu-top">
        <h1 class="logo"><span class="l1">MEAL</span><span class="l2">STEEL</span><em class="logo-tag">FOOD TRUCK MAYHEM</em></h1>
        <div class="bank-pill" id="bankPill"><span class="coin" data-icon="coin"></span><span id="bankValue">1000</span></div>
      </header>

      <button class="arrow left" id="prevTruck" aria-label="Previous truck" data-icon="arrowLeft"></button>
      <button class="arrow right" id="nextTruck" aria-label="Next truck" data-icon="arrowRight"></button>

      <div class="truck-card" id="truckCard">
        <div class="truck-name" id="truckName">Bratzilla</div>
        <div class="truck-food" id="truckFood">brats &amp; hot dogs</div>
      </div>
      <div class="truck-stats" id="truckStats"></div>
      <div class="truck-special"><div class="sticker-hdr">SPECIAL MOVES</div>
        <div class="sp-row"><span class="sp-ico" id="specialIconMenu"></span><div class="sp-txt"><div class="sp-name"><i class="tag light">LIGHT</i><b id="specialName"></b><kbd>SPACE</kbd></div><span id="specialDesc"></span></div></div>
        <div class="sp-row"><span class="sp-ico heavy" id="heavyIconMenu"></span><div class="sp-txt"><div class="sp-name"><i class="tag heavy">HEAVY</i><b id="heavyName"></b><kbd>Q</kbd></div><span id="heavyDesc"></span></div></div>
      </div>

      <footer class="menu-bottom">
        <div class="modes" id="modes">
          <button class="mode" data-mode="race"><i data-icon="flag"></i><b>RACE</b><small>4–8 trucks · podium payout</small></button>
          <button class="mode" data-mode="rumble"><i data-icon="burst"></i><b>RUMBLE</b><small>5–12 trucks · last truck smashing wins</small></button>
          <button class="mode" data-mode="soccer"><i data-icon="ball"></i><b>SOCCER</b><small>3v3 · 4v4 · 5v5 futsal</small></button>
          <button class="mode" data-mode="chairs"><i data-icon="note"></i><b>MUSICAL TRUCKS</b><small>14 trucks · last one parked</small></button>
        </div>
        <div class="bet-row">
          <span class="bet-label">ENTRY BET</span>
          <div class="bets" id="bets"></div>
          <button class="btn play" id="playBtn">PLAY</button>
        </div>
      </footer>
      <div class="hint" id="menuHint"><kbd>WASD</kbd> drive · <kbd>SHIFT</kbd> turbo · <kbd>SPACE</kbd> light move · <kbd>Q</kbd> heavy move · tap &amp; drag on mobile</div>
    </section>

    <!-- PREGAME ROLLER -->
    <section id="pregame" class="screen hidden">
      <div class="roller-title">MATCHMAKING</div>
      <div class="lobby" id="lobby"></div>
      <div class="roller" id="roller"></div>
      <div class="roller-foot" id="rollerFoot"></div>
    </section>

    <!-- HUD -->
    <section id="hud" class="screen hidden">
      <div class="hud-top">
        <div class="board-wrap"><div class="sticker-hdr red">STANDINGS</div><div class="board" id="board"></div></div>
        <div class="center-info">
          <div class="timer" id="timer"></div>
          <div class="sub-info" id="subInfo"></div>
        </div>
        <div class="map-wrap"><div class="sticker-hdr blue">MAP</div><canvas id="minimap" width="200" height="200"></canvas></div>
      </div>
      <div class="announce" id="announce"></div>
      <div class="status-badge hidden" id="statusBadge"><b id="statusText"></b><i><span id="statusFill"></span></i></div>
      <div class="toast-stack" id="toasts"></div>
      <div class="hud-bottom">
        <div class="joystick" id="joystick"><div class="stick" id="stick"></div></div>
        <div class="gauges">
          <div class="gauge hp-gauge hidden" id="hpGauge"><label>HEALTH</label><div class="bar"><div id="hpBar"></div></div></div>
          <div class="gauge"><label><span class="gico" data-icon="flame"></span>TURBO <kbd>SHIFT</kbd></label><div class="bar"><div id="turboBar"></div></div></div>
          <div class="gauge sp"><label><span class="gico" id="lightIcon"></span><b id="specialLabel">LIGHT</b> <kbd>SPACE</kbd></label><div class="bar"><div id="specialBar"></div></div></div>
          <div class="gauge sp heavy"><label><span class="gico" id="heavyIcon"></span><b id="heavyLabel">HEAVY</b> <kbd>Q</kbd></label><div class="bar"><div id="heavyBar"></div></div></div>
          <div class="speed" id="speed">0</div>
        </div>
        <div class="actions">
          <button class="act" id="btnTurbo"><span data-icon="flame"></span><small>TURBO</small></button>
          <button class="act" id="btnSpecial"><span id="specialIcon"></span><small>LIGHT</small></button>
          <button class="act heavy-act" id="btnHeavy"><span id="heavyIconBtn"></span><small>HEAVY</small></button>
          <button class="act small-act" id="btnBrake"><span data-icon="reverse"></span><small>REV</small></button>
        </div>
      </div>
      <button class="quit" id="quitBtn" data-icon="close"></button>
      <button class="cam-btn hidden" id="camBtn"><span data-icon="camera"></span><b id="camLabel">BALL CAM</b><small>C</small></button>
    </section>

    <!-- RESULTS -->
    <section id="results" class="screen hidden">
      <div class="results-card"><div class="res-rays"></div>
        <div class="res-trophy" id="resTrophy"></div><div class="res-title" id="resTitle">FINISHED</div>
        <div class="res-place" id="resPlace">1st</div>
        <div class="res-prize" id="resPrize">+$0</div>
        <div class="res-board" id="resBoard"></div>
        <div class="res-bank">Bank: <b id="resBank">$0</b></div>
        <div class="res-buttons">
          <button class="btn" id="againBtn">PLAY AGAIN</button>
          <button class="btn ghost" id="menuBtn">MENU</button>
        </div>
      </div>
    </section>

    <div id="rotate" class="hidden"><div><span data-icon="rotate"></span><br/>Rotate your device to landscape</div></div>
  </div>
</body>
</html>
