<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#ff6a2a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="Meal Steel: suped-up food trucks race, rumble, play soccer and musical chairs. Bet, drive, win the pot." />
  <link rel="icon" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <title>Meal Steel</title>
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <div id="app">
    <canvas id="gl"></canvas>

    <!-- MAIN MENU -->
    <section id="menu" class="screen">
      <header class="menu-top">
        <h1 class="logo"><span>MEAL</span><span>STEEL</span></h1>
        <div class="bank-pill" id="bankPill"><span class="coin">$</span><span id="bankValue">1000</span></div>
      </header>

      <button class="arrow left" id="prevTruck" aria-label="Previous truck">&#9664;</button>
      <button class="arrow right" id="nextTruck" aria-label="Next truck">&#9654;</button>

      <div class="truck-card" id="truckCard">
        <div class="truck-name" id="truckName">Bratzilla</div>
        <div class="truck-food" id="truckFood">brats &amp; hot dogs</div>
        <div class="truck-stats" id="truckStats"></div>
        <div class="truck-special"><b id="specialName">Sausage Whip</b><span id="specialDesc"></span></div>
      </div>

      <footer class="menu-bottom">
        <div class="modes" id="modes">
          <button class="mode" data-mode="race"><i>🏁</i><b>Race</b><small>4–8 trucks · podium payout</small></button>
          <button class="mode" data-mode="rumble"><i>💥</i><b>Rumble</b><small>12 trucks · most points wins</small></button>
          <button class="mode" data-mode="soccer"><i>⚽</i><b>Soccer</b><small>3v3 · 4v4 · 5v5 futsal</small></button>
          <button class="mode" data-mode="chairs"><i>🎵</i><b>Musical Chairs</b><small>16 trucks · last one parked</small></button>
        </div>
        <div class="bet-row">
          <span class="bet-label">ENTRY BET</span>
          <div class="bets" id="bets"></div>
          <button class="btn play" id="playBtn">PLAY</button>
        </div>
      </footer>
      <div class="hint" id="menuHint">WASD / arrows drive · SHIFT turbo · SPACE special · tap &amp; drag on mobile</div>
    </section>

    <!-- PREGAME ROLLER -->
    <section id="pregame" class="screen hidden">
      <div class="roller-title">MATCHMAKING</div>
      <div class="lobby" id="lobby"></div>
      <div class="roller" id="roller"></div>
      <div class="roller-foot" id="rollerFoot"></div>
    </section>

    <!-- HUD -->
    <section id="hud" class="screen hidden">
      <div class="hud-top">
        <div class="board" id="board"></div>
        <div class="center-info">
          <div class="timer" id="timer"></div>
          <div class="sub-info" id="subInfo"></div>
        </div>
        <canvas id="minimap" width="200" height="200"></canvas>
      </div>
      <div class="announce" id="announce"></div>
      <div class="toast-stack" id="toasts"></div>
      <div class="hud-bottom">
        <div class="joystick" id="joystick"><div class="stick" id="stick"></div></div>
        <div class="gauges">
          <div class="gauge"><label>TURBO</label><div class="bar"><div id="turboBar"></div></div></div>
          <div class="gauge"><label id="specialLabel">SPECIAL</label><div class="bar"><div id="specialBar"></div></div></div>
          <div class="speed" id="speed">0</div>
        </div>
        <div class="actions">
          <button class="act" id="btnTurbo"><span>🔥</span><small>TURBO</small></button>
          <button class="act" id="btnSpecial"><span id="specialIcon">⭐</span><small>SPECIAL</small></button>
          <button class="act small-act" id="btnBrake"><span>⏬</span><small>REV</small></button>
        </div>
      </div>
      <button class="quit" id="quitBtn">✕</button>
    </section>

    <!-- RESULTS -->
    <section id="results" class="screen hidden">
      <div class="results-card">
        <div class="res-title" id="resTitle">FINISHED</div>
        <div class="res-place" id="resPlace">1st</div>
        <div class="res-prize" id="resPrize">+$0</div>
        <div class="res-board" id="resBoard"></div>
        <div class="res-bank">Bank: <b id="resBank">$0</b></div>
        <div class="res-buttons">
          <button class="btn" id="againBtn">PLAY AGAIN</button>
          <button class="btn ghost" id="menuBtn">MENU</button>
        </div>
      </div>
    </section>

    <div id="rotate" class="hidden"><div>↻<br/>Rotate your device to landscape</div></div>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
